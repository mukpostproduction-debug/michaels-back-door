<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="doorGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD074" />
      <stop offset="50%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#E28308" />
    </linearGradient>
    <linearGradient id="doorWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B1B15" />
      <stop offset="100%" stop-color="#1F130E" />
    </linearGradient>
  </defs>
  
  <!-- Glowing doorway aperture behind door -->
  <polygon points="96,25 142,25 142,235 96,250" fill="url(#doorGlow)" />
  
  <!-- Door leaf swinging open into space (perspective projection) -->
  <polygon points="18,25 96,15 96,255 18,245" fill="url(#doorWood)" stroke="#150C09" stroke-width="1.5" />
  
  <!-- Fanlight / Semi-circular transom arches -->
  <path d="M28,68 C28,40 50,30 86,26 L86,68 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" />
  <line x1="42" y1="55" x2="86" y2="68" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
  <line x1="60" y1="39" x2="86" y2="68" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
  <line x1="78" y1="30" x2="86" y2="68" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
  
  <!-- Top Left Panel -->
  <polygon points="26,76 52,73 52,143 26,145" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85" />
  
  <!-- Top Right Panel -->
  <polygon points="58,72 88,69 88,139 58,142" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85" />
  
  <!-- Lock Rail Knob & Handle -->
  <circle cx="90" cy="142" r="2.8" fill="#FFFFFF" opacity="0.95" />
  <rect x="88.5" y="150" width="3" height="16" rx="1.5" fill="#FFFFFF" opacity="0.9" />
  
  <!-- Bottom Left Panel -->
  <polygon points="26,155 52,153 52,230 26,233" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85" />
  
  <!-- Bottom Right Panel -->
  <polygon points="58,152 88,149 88,225 58,228" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85" />
</svg>