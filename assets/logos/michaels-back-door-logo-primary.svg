<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="glowGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD685" />
      <stop offset="60%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#D97F06" />
    </linearGradient>
    <linearGradient id="espressoWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B1911" />
      <stop offset="100%" stop-color="#1F110B" />
    </linearGradient>
  </defs>

  <!-- Door Icon Mark -->
  <g transform="translate(15, 10)">
    <!-- Glowing doorway aperture -->
    <polygon points="75,20 112,20 112,185 75,198" fill="#D8C7B5" />
    
    <!-- Door leaf -->
    <polygon points="12,20 75,12 75,202 12,194" fill="url(#espressoWood)" stroke="#190E09" stroke-width="1.5" />
    
    <!-- Transom Window Fanlight -->
    <path d="M20,55 C20,32 37,24 67,21 L67,55 Z" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
    <line x1="32" y1="44" x2="67" y2="55" stroke="#FFFFFF" stroke-width="1.8" opacity="0.9" />
    <line x1="46" y1="32" x2="67" y2="55" stroke="#FFFFFF" stroke-width="1.8" opacity="0.9" />
    <line x1="59" y1="25" x2="67" y2="55" stroke="#FFFFFF" stroke-width="1.8" opacity="0.9" />
    
    <!-- Top Left Panel -->
    <polygon points="18,61 39,59 39,114 18,116" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85" />
    
    <!-- Top Right Panel -->
    <polygon points="44,58 68,56 68,111 44,113" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85" />
    
    <!-- Knob & Handle -->
    <circle cx="70" cy="113" r="2.2" fill="#FFFFFF" opacity="0.95" />
    <rect x="69" y="120" width="2.4" height="13" rx="1.2" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Bottom Left Panel -->
    <polygon points="18,124 39,122 39,183 18,185" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85" />
    
    <!-- Bottom Right Panel -->
    <polygon points="44,121 68,119 68,179 44,181" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85" />
  </g>

  <!-- Typography Suite -->
  <!-- Line 1: MICHAEL'S -->
  <text x="150" y="68" font-family="'Avenir Next', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="5" fill="#2A1911">
    MICHAEL’S
  </text>
  
  <!-- Line 2: BACK DOOR -->
  <text x="150" y="124" font-family="'Avenir Next', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="6.5" fill="#B59976">
    BACK DOOR
  </text>

  <!-- Line 3: RESTAURANT -->
  <text x="152" y="166" font-family="'Avenir Next', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="600" letter-spacing="8" fill="#6F7275">
    RESTAURANT
  </text>
</svg>